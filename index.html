<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAD-BOY CORE | HQ</title>
    <style>
        :root { --red: #ff003c; --gold: #ffaa00; --dark: #0f0f0f; --glass: rgba(255,255,255,0.05); }
        body { background: var(--dark); color: white; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .header { border-left: 5px solid var(--red); padding-left: 15px; margin-bottom: 30px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { background: var(--glass); padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .stat-card h3 { font-size: 0.8rem; color: #888; margin: 0; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; margin-top: 10px; }
        .in-flow { color: #00ff88; }
        .out-flow { color: var(--gold); }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; color: var(--red); padding: 10px; border-bottom: 2px solid #333; }
        td { padding: 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

    <div class="header">
        <h1>CZ-CORE : MISSION_MONEY_AND_HONEY</h1>
        <p>STATUS: RUNNING_AGGRESSIVE | NO_SAD_ZONE</p>
    </div>

    <div class="grid-container">
        <div class="stat-card">
            <h3>CAPITAL_INVESTED (IN)</h3>
            <div class="value in-flow" id="totalIn">$1,000.00</div>
        </div>
        <div class="stat-card">
            <h3>CURRENT_EXCHANGE_PRICE</h3>
            <div class="value" id="currentPrice">$1.25</div>
        </div>
        <div class="stat-card">
            <h3>ASSET_AMOUNT</h3>
            <div class="value" id="assetAmount">800.00 UNIT</div>
        </div>
        <div class="stat-card">
            <h3>PASSIVE_EARNINGS (OUT)</h3>
            <div class="value out-flow" id="totalOut">$150.00</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>DATE</th>
                <th>ACTION</th>
                <th>PRICE</th>
                <th>AMOUNT</th>
                <th>TOTAL_VALUE</th>
            </tr>
        </thead>
        <tbody id="logData">
            <tr>
                <td>2025-12-23</td>
                <td>DEPOSIT</td>
                <td>$1.00</td>
                <td>1000</td>
                <td>$1000.00</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
