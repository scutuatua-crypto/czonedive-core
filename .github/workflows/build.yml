name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Verify Repository Structure
        run: |
          echo "Checking repository files..."
          ls -la
          echo "Structure verified successfully!"
