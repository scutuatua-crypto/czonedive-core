name: Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.paper'
      - '**.xlsx'
      - '**.patch'
      - '**.diff'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

