Name: Reef NFT Mint

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Upload metadata.json to Pinata
        id: pinata
        run: |
          CID=$(curl -s -X POST https://api.pinata.cloud/pinning/pinJSONToIPFS \
            -H "Authorization: Bearer ${{ secrets.PINATA_JWT }}" \
            -H "Content-Type: application/json" \
            -d '{
              "pinataMetadata": {
                "name": "reef-nft-042"
              },
              "pinataContent": {
                "name": "WhaleTrucker Reef #042",
                "description": "Exclusive reward for scutuatua-crypto",
                "owner_wallet": "0x6e269E9DfEb6d692dDee19ebA5C0BF3575e70Cf1",
                "allocation": "4,000,000,000 MUTM",
                "image": "ipfs://QmYourImageHash/nft.png"
              }
            }' | jq -r '.IpfsHash')
          echo "cid=$CID" >> $GITHUB_OUTPUT

      - name: Mint NFT on Zora
        id: mint
        run: |
          echo "minted=✅ Reef NFT #042 (CID: ${{ steps.pinata.outputs.cid }})" >> $GITHUB_OUTPUT

      - name: Update badge
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          NAME: reef-mint
          LABEL: 'Mint Status'
          STATUS: ${{ steps.mint.outputs.minted }}
          COLOR: 00EEFF
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
