name: Lint

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.paper'
      - '**.xlsx'
      - '**.patch'
      - '**.diff'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.paper'
      - '**.xlsx'
      - '**.patch'
      - '**.diff'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

