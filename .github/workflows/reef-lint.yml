name: Lint

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.paper'
      - '**.xlsx'
      - '**.patch'
      - '**.diff'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.paper'
      - '**.xlsx'
      - '**.patch'
      - '**.diff'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Inline check prevents crashes if package.json is missing
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install --ignore-scripts
          else
            echo "No package.json found, skipping."
          fi

      # Inline rules bypass the missing configuration file error
      - name: Run linter
        run: |
          npx eslint . --ext .js,.ts --no-eslintrc --rules '{"no-unused-vars": "warn", "no-console": "off"}'
