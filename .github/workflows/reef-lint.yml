name: Reef Lint Governance

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.paper'
      - '**.xlsx'
      - '**.patch'
      - '**.diff'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Temporarily commented out until package.json is added to the root directory
      # - name: Install dependencies
      #   run: npm install

      - name: Run ESLint
        run: npx eslint "**/*.js"
